# Joinc AI Static Site Generator Global Configuration
# 이 파일은 사이트 빌더의 단일 진실 공급원(SSOT) 역할을 합니다.

title: "AI Info"
subtitle: "Enterprise AI & Software Engineering Tech Blog"
baseURL: "/"
cname: "www.joinc.co.kr"

# 활성 테마: "default-light" (라이트 테마) 또는 "default" (다크 테마)
theme: "default-light"

# 경로 매핑
source: "posts"
pages: "pages"
output: "dist"
redirects: "redirect.yaml"

# 다국어(i18n) 설정
i18n:
  default_lang: "ko"
  languages:
    - code: "ko"
      name: "한국어"
      base_url: "/"
      source_dir: "posts"
      post_pattern: "*.md"
      messages_file: "messages.yaml"
      output_prefix: ""
    - code: "en"
      name: "English"
      base_url: "/en/"
      source_dir: "posts"
      post_pattern: "*.en.md"
      page_suffix: ".en"
      messages_file: "messages_en.yaml"
      output_prefix: "en"
